name: Test  
on: [push]  
jobs:  
  test:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with: { python-version: "3.12" }  
      - run: pip install poetry && poetry install  
      - run: pip install pytest && poetry run pytest  # Add tests later  
